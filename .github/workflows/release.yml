name: Release

# Releases run from a `v*` tag, but only when that tag points at a commit on the
# main branch. The `guard` job enforces it, so a tag created from a side branch
# cannot publish. Manual runs are also restricted to main.
# See GITHUB-ACTIONS.md to change the allowed branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and package only (do not publish)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------ branch guard
  guard:
    name: Branch guard (tag must come from main)
    uses: ./.github/workflows/branch-guard.yml

  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify manifest, lint, format and types
        run: |
          npm run verify:manifest
          npm run check
          npm run typecheck
      - name: Unit tests
        run: npm run test:unit

  publish:
    name: Publish to the VS Code Marketplace
    runs-on: ubuntu-latest
    needs:
      - guard
      - verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and package
        run: npm run package
      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'push' || inputs.dry-run == false
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not configured. Add a Personal Access Token to publish."
            exit 1
          fi
          npx vsce publish --packagePath ./*.vsix --pat "$VSCE_PAT"
      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      # No artifacts are stored and no binaries are attached to the release:
      # the VSIX is published to the VS Code Marketplace and then discarded.
