name: CI

# Only the main branch may trigger this workflow, plus manual runs from main.
# Tags are handled by release.yml. The `guard` job below enforces the rule even
# for manual dispatches. See GITHUB-ACTIONS.md to change the allowed branch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------ branch guard
  guard:
    name: Branch guard (main only)
    uses: ./.github/workflows/branch-guard.yml

  # ---------------------------------------------------------------- manifest
  manifest:
    name: Manifest & Marketplace rules
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify manifest
        run: npm run verify:manifest

  # ------------------------------------------------------------------- lint
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  # ----------------------------------------------------------------- format
  format:
    name: Format check (Biome)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check

  # -------------------------------------------------------------- typecheck
  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck

  # ------------------------------------------------- per-module unit tests
  unit-tests:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        module:
          - infra
          - css
          - js
          - markup
          - analysis
          - scenarios
          - reports
          - components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ${{ matrix.module }} tests
        run: npm run test:unit:${{ matrix.module }}

  # --------------------------------------------------------------- coverage
  coverage:
    name: Coverage (all unit tests)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      # No artifacts are stored: the coverage summary is printed in this job's log.

  # ------------------------------------------------------- integration tests
  integration-tests:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run VS Code integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: Run VS Code integration tests (Windows)
        if: runner.os != 'Linux'
        run: npm run test:vscode

  # ------------------------------------------------------------------ build
  build:
    name: Build bundle (dist)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Show bundle output
        run: ls -la dist
      # No artifacts are stored: the build is verified in place and discarded.

  # ---------------------------------------------------------------- package
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs:
      - guard
      - build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and package
        run: npm run package
      - name: List package contents
        run: npx vsce ls
      # No artifacts are stored: packaging is verified and the VSIX is discarded.

  # ---------------------------------------------------------------- summary
  ci-status:
    name: CI summary
    runs-on: ubuntu-latest
    needs:
      - guard
      - manifest
      - lint
      - format
      - typecheck
      - unit-tests
      - integration-tests
      - build
      - package
    if: always()
    steps:
      - name: Report status
        run: |
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.manifest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ${{ needs.format.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | ${{ needs.package.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more steps failed." >&2
            exit 1
          fi
          echo "All CI steps passed."
