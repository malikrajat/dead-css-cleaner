name: CodeQL

# Security analysis runs on the main branch (pushes and the weekly schedule,
# which always analyses the default branch) and on manual dispatches from main.
# See GITHUB-ACTIONS.md to change the allowed branch.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------ branch guard
  guard:
    name: Branch guard (main only)
    uses: ./.github/workflows/branch-guard.yml

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
